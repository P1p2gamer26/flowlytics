name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: check --deploy
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "clave-de-ci-solo-para-el-check-no-secreta"
          DATABASE_URL: "postgres://u:p@localhost:5432/vision"
          ANTHROPIC_API_KEY: "sk-ci-placeholder"
        run: python manage.py check --deploy

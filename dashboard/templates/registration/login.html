{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Flowlytics</title>
  <link rel="icon" type="image/png" href="{% static 'dashboard/app/favicon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Poppins:wght@400;500&display=swap">
  <style>
    /* Los mismos valores que frontend/src/estilos.css. La pantalla de entrada
       no carga el bundle de React —todavía no hay sesión— así que el sistema
       visual se repite aquí a mano, corto y sin dependencias. */
    :root {
      --papel: #f2f3ee; --panel: #fff; --tinta: #18231f; --tinta-2: #5a6b64;
      --calma: #0f7a57; --lleno: #e9a13b; --fila: #d6432c; --noche: #10201c;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--papel); color: var(--tinta);
      font-family: "Poppins", system-ui, sans-serif;
      padding: 1.5rem;
    }
    .caja { width: 100%; max-width: 24rem; }
    h1 {
      font-family: "Montserrat", system-ui, sans-serif;
      font-weight: 800; font-size: 2rem; line-height: 1.15;
      margin: 0 0 .35rem; letter-spacing: -.01em;
    }
    p.sub { margin: 0 0 1.75rem; color: var(--tinta-2); }
    /* Tres barras con los colores del sistema: es la cinta del día en miniatura,
       lo primero que se verá dentro. Decoración no, anticipo. */
    .cinta { display: flex; gap: 3px; height: 2.25rem; align-items: flex-end;
             margin-bottom: 1.25rem; }
    .cinta i { flex: 1; border-radius: 2px; background: var(--calma); }
    .cinta i:nth-child(2) { height: 65%; background: var(--lleno); }
    .cinta i:nth-child(1) { height: 38%; }
    .cinta i:nth-child(3) { height: 100%; background: var(--fila); }
    .cinta i:nth-child(4) { height: 45%; }
    label { display: block; margin-bottom: .35rem; font-weight: 500; }
    input {
      width: 100%; padding: .65rem .75rem; margin-bottom: 1rem;
      border: 1px solid rgba(90,107,100,.35); border-radius: 6px;
      background: var(--panel); color: inherit; font: inherit;
    }
    input:focus-visible { outline: 2px solid var(--calma); outline-offset: 2px; }
    button {
      width: 100%; padding: .7rem 1rem; border: 0; border-radius: 6px;
      background: var(--noche); color: var(--papel); font: inherit;
      font-weight: 500; cursor: pointer;
    }
    button:hover { background: var(--calma); }
    button:focus-visible { outline: 2px solid var(--calma); outline-offset: 2px; }
    .error {
      border-left: 3px solid var(--fila); background: rgba(214,67,44,.1);
      padding: .6rem .8rem; margin-bottom: 1.25rem; color: var(--tinta);
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="caja">
    <div class="cinta" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <h1>Cómo fue el día en tu negocio</h1>
    <p class="sub">Entra para ver quién pasó, cuándo se llenó y dónde se hizo fila.</p>

    {% if form.errors %}
      <p class="error">Ese usuario o esa contraseña no coinciden. Inténtalo otra vez.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_username">Usuario</label>
      <input type="text" name="username" id="id_username" autocomplete="username"
             autofocus required>

      <label for="id_password">Contraseña</label>
      <input type="password" name="password" id="id_password"
             autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
